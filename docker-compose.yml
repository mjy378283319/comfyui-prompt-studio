# Unraid / NAS 部署用：直接拉 GHCR 预构建镜像，无需在 NAS 上构建。
#   docker compose pull && docker compose up -d
#
# 建议放置目录：/mnt/user/appdata/comfyui-prompt-studio/
# 如用绝对路径，把下面 ./data / ./models 换成：
#   /mnt/user/appdata/comfyui-prompt-studio/data:/app/data
#   /mnt/user/appdata/comfyui-prompt-studio/models:/app/models/wd14
services:
  comfyui-prompt-studio:
    image: ghcr.io/mjy378283319/comfyui-prompt-studio:latest
    container_name: comfyui-prompt-studio
    restart: unless-stopped
    ports:
      - "8199:8199"
    environment:
      # Unraid 的 nobody:users，保证挂载目录里生成的文件属主正确
      PUID: 99
      PGID: 100
      PORT: 8199

      # ── ComfyUI（B 房，经 A 房 frp 隧道）────────────────────────
      # 18189 = B 房 cu130 / Z-Image INT8（主用，约 9.7s/张）
      # 18188 = B 房秋叶包 / Z-Image GGUF
      # 容器里的 127.0.0.1 指向自己，绝不能填 127.0.0.1。
      # 若 ComfyUI 就在同一台 NAS 上，改回 http://host.docker.internal:8188
      COMFYUI_URL: "http://host.docker.internal:18189"
      # B 房 ComfyUI 开了 --auth 时，把凭据写进 URL（不要提交到仓库）：
      # COMFYUI_URL: "http://comfyuser:你的强密码@host.docker.internal:18189"

      # 出图引擎：zimage-int8（8189 cu130，推荐）/ zimage-gguf（8188）/ sd（原通用模板）
      WORKFLOW_ENGINE: "zimage-int8"
      # 默认首页：studio=AI 角色合成台（与上游 Studio 一致），workbench=四层工作台
      DEFAULT_VIEW: "studio"

      # ── 出图自动归档 ───────────────────────────────────────────
      # 图片存到 ./data/gallery/YYYYMM/，复用现有持久化卷，无需新增挂载。
      # B 房关机后仍可在工作台里查看 / 搜索 / 复用提示词。
      GALLERY_ENABLED: "true"
      GALLERY_POLL_INTERVAL: "8"      # 轮询秒数；ComfyUI 离线时自动退避到最多 60s
      GALLERY_INIT_MODE: "from_now"   # from_now=只归档启动后新出的图；all=连历史一起回填
      GALLERY_HISTORY_LIMIT: "64"     # 每轮只取最近 64 条 history，避免打爆隧道
      GALLERY_MAX_IMAGE_MB: "20"      # 单张图上限
      GALLERY_MAX_ITEMS: "0"          # 0=不限量；填 3000 则自动淘汰最旧记录及其图片
      TZ: "Asia/Shanghai"

      # WD14 反推置信度阈值（仅挂载模型后生效）
      WD14_THRESHOLD: "0.35"

      # ── 登录与访问控制（与拓竹耗材管家同一套口径）──────────
      # 留空时：首次在内网直连打开 http://<NAS-IP>:8199/login 自行创建管理员。
      # 想跳过首次设置（Unraid 模板化部署）就取消注释并换成自己的口令，
      # 至少 8 位、不要纯数字或纯字母；口令哈希存在 ./data/auth.json。
      # APP_PASSWORD: "换成你的口令"
      # APP_USERNAME: "admin"
      SESSION_TTL_DAYS: "30"        # 会话有效期（天），每次访问滑动续期
      TRUST_PROXY: "true"           # 挂在 Lucky / Nginx 反代后，读取 X-Forwarded-*
      REQUIRE_HTTPS: "false"        # 公网部署建议 true：http 请求强制 308 跳 https
      ALLOW_PUBLIC_SETUP: "false"   # 禁止公网来源抢先创建管理员
      LOGIN_MAX_ATTEMPTS: "5"       # 连续失败锁定阈值
      LOGIN_LOCKOUT_MINUTES: "5"
      # ALLOWED_ORIGINS: "https://prompt.example.com"  # 需要跨站调用时才填

      # ── 姿势参考库（可选只读挂载）────────────────────────
      REFERENCE_DIR: /app/reference
      POSE_REFERENCE_ENABLED: "true"
      # 成人模式：默认关闭。设为 true 后仍需登录 + 内网直连 + 界面二次确认才解锁，
      # 且只额外开放「全身单人・性感系」单人姿势；重启容器自动回到 SFW。
      POSE_ADULT_MODE: "false"

      # 可选：外部视觉接口（OpenAI 兼容 /v1/chat/completions），留空即不启用
      # REMOTE_VISION_URL: "https://your-api.example.com/v1/chat/completions"
      # REMOTE_VISION_KEY: ""
      # REMOTE_VISION_MODEL: "gpt-4o-mini"
      # REMOTE_VISION_MODE: "openai"
      # REMOTE_VISION_TIMEOUT: "45"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 用户预设 + 登录凭据 + 出图归档图片（./data/gallery/）都持久化在这里；
      # 首次启动会自动补齐内置词库/指南/预设，不会覆盖已有文件
      - ./data:/app/data
      # 可选：放入 model.onnx + selected_tags.csv 后启用 WD14 本地反推
      - ./models:/app/models/wd14
      # 可选：自行 clone anhao/ai-pose-gallery-zh 后挂进来（只读，镜像不含任何上游数据/图片）
      # - /mnt/user/appdata/ai-pose-gallery-zh:/app/reference:ro
