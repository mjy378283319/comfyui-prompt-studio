# 在 NAS 或本机从源码自行构建（无需 GHCR）。
#   docker compose -f docker-compose.build.yml up -d --build
# 需要 WD14 本地反推时：把 WITH_ONNX 改成 "1"（会联网装 onnxruntime/numpy/Pillow）。
services:
  comfyui-prompt-studio:
    build:
      context: .
      args:
        WITH_ONNX: "0"
        PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"
    image: comfyui-prompt-studio:local
    container_name: comfyui-prompt-studio
    restart: unless-stopped
    ports:
      - "8199:8199"
    environment:
      PUID: 99
      PGID: 100
      PORT: 8199
      # A 房 frp 隧道端口 → B 房 cu130 / Z-Image INT8
      # 开 --auth 时写成 http://账号:密码@host.docker.internal:18189
      COMFYUI_URL: "http://host.docker.internal:18189"
      WORKFLOW_ENGINE: "zimage-int8"
      GALLERY_ENABLED: "true"
      GALLERY_POLL_INTERVAL: "8"
      GALLERY_INIT_MODE: "from_now"
      GALLERY_HISTORY_LIMIT: "64"
      GALLERY_MAX_ITEMS: "0"
      TZ: "Asia/Shanghai"
      WD14_THRESHOLD: "0.35"
      SESSION_TTL_DAYS: "30"
      TRUST_PROXY: "true"
      REQUIRE_HTTPS: "false"
      ALLOW_PUBLIC_SETUP: "false"
      LOGIN_MAX_ATTEMPTS: "5"
      LOGIN_LOCKOUT_MINUTES: "5"
      # APP_PASSWORD: "换成你的口令"
      # APP_USERNAME: "admin"
      REFERENCE_DIR: /app/reference
      POSE_REFERENCE_ENABLED: "true"
      POSE_ADULT_MODE: "false"
      DEFAULT_VIEW: "studio"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./models:/app/models/wd14
      # - /mnt/user/appdata/ai-pose-gallery-zh:/app/reference:ro
